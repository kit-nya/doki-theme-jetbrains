# GitHub Actions Workflow created for handling the release process.
# When a release is published, this workflow automatically bumps the version in gradle.properties,
# patches CHANGELOG.md by shifting unreleased notes into the versioned section, pushes the update to main,
# and publishes the plugin artifact to JetBrains Marketplace and GitHub Releases.
# Running the publishPlugin task requires all the following secrets: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ published, prereleased, released ]

jobs:

  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
    steps:

      # Check out main branch with full history to allow pushing changelog and tag updates
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Bump version and patch CHANGELOG.md with unreleased notes / release body
      - name: Patch Changelog and Bump Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "Publishing version: $VERSION"

          # Update pluginVersion in gradle.properties
          sed -i "s/^pluginVersion = .*/pluginVersion = $VERSION/" gradle.properties

          # Patch CHANGELOG.md
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          if [ -n "$RELEASE_BODY" ]; then
            echo "$RELEASE_BODY" > "$RELEASE_NOTE"
            ./gradlew patchChangelog -PpluginVersion="$VERSION" --release-note-file="$RELEASE_NOTE"
          else
            ./gradlew patchChangelog -PpluginVersion="$VERSION"
          fi

          # Commit and push updated CHANGELOG.md and gradle.properties to main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md gradle.properties
          if ! git diff --staged --quiet; then
            git commit -m "Release $VERSION [skip ci]"
            git push origin main

            # Update release tag to point to the release commit
            git tag -f "$TAG_NAME"
            git push origin -f "$TAG_NAME"
          fi

      - name: Get Master Themes
        run: ./getMasterThemes.sh

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload the built artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*.zip --clobber

      # Trigger website deployment in doki-theme-home
      - name: Trigger Website Update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          repository: kit-nya/doki-theme-home
          event-type: jetbrains-release
          client-payload: '{"version": "${{ env.TAG_NAME }}"}'
